name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#5856d6&color_dots=#ececf1,#d9d8f7,#b3b1ee,#8583e6,#5856d6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#7d7aff&color_dots=#1c1c1e,#2a2a55,#46449e,#6360e0,#9d9bff

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
